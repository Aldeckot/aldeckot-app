  <style id="inventory-header-critical">
    /* O cabeçalho continua legível se um recurso visual não voltar após a aba ficar ociosa. */
    body.inventory-open .inventory-header{justify-content:flex-start}
    body.inventory-open .inventory-header .module-header-summary{display:grid;grid-template-columns:minmax(0,205px) minmax(170px,210px);align-items:center;gap:4px;flex:0 1 420px;max-width:420px;min-width:0;min-height:64px}
    .module-header-summary-copy{display:grid;gap:4px;min-width:0}
    .module-header-summary-title{margin:0;overflow:hidden;color:#f4f9ff;font-size:clamp(19px,1.75vw,27px);font-weight:800;letter-spacing:-.65px;line-height:1.05;text-overflow:ellipsis;white-space:nowrap}
    .module-header-summary-description{margin:0;overflow:hidden;color:#b8cbe0;font-size:clamp(10px,.82vw,12px);line-height:1.25}
    .module-header-summary-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
    .module-header-summary-tags span{padding:2px 5px;border:1px solid #57728c82;border-radius:999px;background:#06182a91;color:#d1e8f8;font-size:7px;font-weight:850;letter-spacing:.02em;line-height:1;text-transform:uppercase;white-space:nowrap}
    .module-header-summary-art{display:block;width:100%;height:clamp(88px,8vw,120px);background-position:center;background-repeat:no-repeat;background-size:contain;filter:drop-shadow(0 8px 12px #00000045);transform:translateX(-78px);pointer-events:none}
    .module-header-summary-art.inventory{background-image:url('assets/module-inventory-illustration.png')}
    body.inventory-open .inventory-header .module-header-animation{--inventory-empty-main:#39cdf4;--inventory-empty-purple:#a97cff;--inventory-empty-pink:#fb73dd;--inventory-empty-cyan:#3ee7f4;--inventory-empty-green:#55e6b2;--inventory-empty-yellow:#ffd45d;--inventory-empty-dot:#55bfff;--inventory-empty-glow:#2fbef44a;position:relative;display:grid;flex:1 1 300px;place-items:center;min-width:130px;height:104px;padding:0!important;overflow:hidden;pointer-events:none}
    body.inventory-open .inventory-header .inventory-header-cube-scene .inventory-empty-illustration{position:relative;width:min(100%,590px)!important;height:104px;filter:drop-shadow(0 3px 8px #24bfff70);transform:none}
    body.inventory-open .inventory-header .module-mascot-dock{flex:0 0 72px;width:72px;height:76px;margin:0 24px 0 auto}
    body.inventory-open .inventory-header .inventory-header-actions{margin-left:0!important}
    .system-header-brand{display:flex;align-items:center;gap:8px;min-width:0;padding:2px 0 2px 7px;color:inherit;text-decoration:none}
    .system-header-brand-mark{display:block;flex:0 0 56px;width:56px;height:52px;overflow:hidden}
    .system-header-brand-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .system-header-brand-copy b{display:block;color:#75cfff;font-size:18px;font-weight:850;white-space:nowrap}
    .theme-light .module-header-summary-title{color:#1c3d59}
    .theme-light .module-header-summary-description{color:#4b708e}
    .theme-light .module-header-summary-tags span{border-color:#80a6bf91;background:#f6fbffb5;color:#29516e}
    .theme-light .module-header-summary-art{filter:drop-shadow(0 6px 9px #38546d28) saturate(1.12) contrast(1.04);transform:translateX(-68px)}
    .theme-light .inventory-header .module-header-animation{--inventory-empty-main:#149bcb;--inventory-empty-purple:#8060d3;--inventory-empty-pink:#d75aa9;--inventory-empty-cyan:#119caf;--inventory-empty-green:#169d72;--inventory-empty-yellow:#bd8914;--inventory-empty-dot:#3184ce;--inventory-empty-glow:#347fc42e}
    @media(max-width:1050px){body.inventory-open .inventory-header{flex-wrap:wrap}body.inventory-open .inventory-header .module-header-summary{flex-basis:360px}body.inventory-open .inventory-header .module-header-animation{order:3;flex-basis:100%;height:82px}body.inventory-open .inventory-header .inventory-header-cube-scene .inventory-empty-illustration{height:74px}}
    @media(max-width:760px){.system-header-brand-mark{flex-basis:43px;width:43px;height:42px}.system-header-brand-copy b{font-size:14px}}
  </style>
