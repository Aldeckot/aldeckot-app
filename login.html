<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ALDECKOT</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <div class="login-wallpaper" aria-hidden="true"><div class="login-dashboard-preview"><i></i><i></i><i></i><i></i></div></div>
  <main class="login-shell">
    <section id="signInModal" class="auth-modal" aria-labelledby="signInTitle">
      <div class="auth-modal-heading"><img class="login-mascot mascot-dark" src="assets/mascot-dark.png" alt=""><img class="login-mascot mascot-light" src="assets/mascot-light-clean.png" alt=""><div><span>ALDECKOT</span><h1 id="signInTitle">Entrar na conta</h1></div></div>
      <p id="signInMessage" class="auth-message" role="status" hidden></p>
      <form id="signInForm" class="auth-form">
        <label>Código de usuário<input name="userCode" inputmode="numeric" autocomplete="username" required minlength="4" maxlength="12" pattern="[0-9]+" placeholder="Ex.: 1014"></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label>
        <button class="auth-primary" type="submit">Entrar</button>
      </form>
      <p class="auth-register-link">Ainda não possui acesso? <button id="openSignUp" type="button">Cadastre-se</button></p>
    </section>

    <section id="signUpModal" class="auth-modal" aria-labelledby="signUpTitle" hidden>
      <div class="auth-modal-heading"><img class="login-mascot mascot-dark" src="assets/mascot-dark.png" alt=""><img class="login-mascot mascot-light" src="assets/mascot-light-clean.png" alt=""><div><span>ALDECKOT</span><h1 id="signUpTitle">Criar novo usuário</h1></div></div>
      <p id="signUpMessage" class="auth-message" role="status" hidden></p>
      <form id="signUpForm" class="auth-form">
        <label>Nome completo<input name="fullName" autocomplete="name" required minlength="3" placeholder="Como deseja ser identificado"></label>
        <label>Código de usuário<input name="userCode" inputmode="numeric" autocomplete="username" required minlength="4" maxlength="12" pattern="[0-9]+" placeholder="Crie um código numérico único"></label>
        <label>Senha<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Ao menos 8 caracteres"></label>
        <label>Confirmar senha<input name="passwordConfirmation" type="password" autocomplete="new-password" required minlength="8" placeholder="Repita sua senha"></label>
        <button class="auth-primary" type="submit">Enviar solicitação</button>
      </form>
      <p class="auth-register-link">Já possui uma conta? <button id="openSignIn" type="button">Entrar</button></p>
    </section>

    <section id="requestProcessing" class="request-processing" role="status" aria-live="polite" hidden>
      <img class="login-mascot mascot-dark" src="assets/mascot-dark.png" alt=""><img class="login-mascot mascot-light" src="assets/mascot-light-clean.png" alt="">
      <h1>Sua solicitação está sendo processada</h1>
      <p>Aguarde a confirmação de um administrador para acessar o sistema.</p>
      <button id="backToSignIn" class="auth-secondary" type="button">Voltar para entrar</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="runtime-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="theme.js"></script>
  <script src="login.js"></script>
</body>
</html>
