<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — ALDECKOT</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <div class="login-wallpaper" aria-hidden="true">
    <div class="login-dashboard-preview"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <main class="login-shell">
    <section class="login-card" aria-live="polite">
      <div class="login-brand"><img class="login-mascot mascot-dark" src="assets/mascot-dark.png" alt=""><img class="login-mascot mascot-light" src="assets/mascot-light-clean.png" alt=""><div><b>ALDECKOT</b><span>SISTEMA DE GESTÃO</span></div></div>
      <div class="login-heading"><h1>ALDECKOT Sistema de Gestão</h1><p id="loginIntro">Entre com sua conta para acessar o ambiente corporativo.</p></div>
      <p id="loginMessage" class="login-message" role="status" hidden></p>
      <form id="signInForm" class="login-form">
        <label>E-mail<input name="email" type="email" autocomplete="email" required placeholder="seu@email.com"></label>
        <label>Senha<input name="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label>
        <button class="login-primary" type="submit">Entrar</button>
      </form>
      <form id="signUpForm" class="login-form" hidden>
        <label>Nome completo<input name="fullName" autocomplete="name" required minlength="3" placeholder="Como deseja ser identificado"></label>
        <label>E-mail<input name="email" type="email" autocomplete="email" required placeholder="seu@email.com"></label>
        <label>Senha<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="Ao menos 8 caracteres"></label>
        <label>Confirmar senha<input name="passwordConfirmation" type="password" autocomplete="new-password" required minlength="8" placeholder="Repita sua senha"></label>
        <button class="login-primary" type="submit">Enviar solicitação</button>
      </form>
      <button id="loginSecondary" class="login-secondary" type="button">Criar conta</button>
      <p class="login-note">Contas novas aguardam aprovação de um administrador.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="runtime-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="theme.js"></script>
  <script src="login.js"></script>
</body>
</html>
