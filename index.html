function save(){localStorage.setItem('aldeckot-data',JSON.stringify(db))}function esc(s=''){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}function toggleTheme(){let b=document.querySelector('.theme-toggle');let light=b.dataset.light==='1';b.dataset.light=light?'0':'1';b.innerHTML=light?'<span>☼</span> Tema Claro':'<span>☾</span> Tema Escuro';document.documentElement.style.setProperty('--bg',light?'#090b14':'#e9eef8');document.documentElement.style.setProperty('--text',light?'#edf1ff':'#182038');toast(light?'Tema escuro ativado':'Tema claro ativado')}
function renderNav(){$('#nav').innerHTML=navs.map(([id,ic,n])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${ic} <span>${n}</span></button>`).join('')}
function header(){let name=current==='home'?'Bem-vindo ao Sistema':db[current].name;$('#pageTitle').textContent=name;$('#pageSub').textContent=current==='home'?'Visão geral operacional':'Dados locais • sincronização preparada';$('#headerActions').innerHTML=current==='home'?`<button class="btn" onclick="go('inventory')">Abrir módulos</button>`:`<button class="btn" onclick="exportCsv()">⇩ CSV</button><button class="btn" onclick="backup()">◫ Backup</button><button class="btn" onclick="restoreClick()">↥ Restaurar</button><button class="btn" onclick="toast('Sincronização preparada. Configure o JSONBin para ativá-la.')">⟳ Sincronizar</button>${current!=='management'?`<button class="btn primary" onclick="openItemForm()">+ Adicionar</button>`:`<button class="btn primary" onclick="openDeviceForm()">+ Equipamento</button>`}`}
function go(id){current=id;query='';statusFilter='';render()}function render(){document.body.classList.toggle('home-page',current==='home');renderNav();header();$('#app').innerHTML=current==='home'?home():current==='management'?management():moduleView()}
function home(){let date=new Date(),month=date.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),first=new Date(date.getFullYear(),date.getMonth(),1).getDay(),last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate(),days=['D','S','T','Q','Q','S','S'];let grid=[...days,...Array(first).fill(''),...Array.from({length:last},(_,i)=>i+1)];return `<div class="home-reference"><div class="home-intro"><h2>Bem-vindo ao Sistema</h2><p>Selecione um módulo no menu lateral para começar</p></div><aside class="home-calendar"><div class="home-cal-title"><i>▣</i>${month.charAt(0).toUpperCase()+month.slice(1)}</div><div class="days">${grid.map(d=>`<span class="day ${d===date.getDate()?'today':''}">${d}</span>`).join('')}</div><div class="home-time"><div id="clock"></div><small>${date.toLocaleDateString('pt-BR',{weekday:'long'}).replace(/^./,c=>c.toUpperCase())}</small></div></aside></div>`}
function moduleView(){let m=db[current],tables=m.tables,active=tables.find(t=>t.id===activeTables[current])||tables[0];if(!active&&tables.length)active=tables[0];if(active)activeTables[current]=active.id;let cols=columns(),items=(active?.items||[]).filter(i=>JSON.stringify(i).toLowerCase().includes(query.toLowerCase())&&(!statusFilter||i.status===statusFilter));return `<div class="layout"><aside class="panel table-side"><div class="section-title">Tabelas <button class="btn icon" onclick="openTableForm()">+</button></div><div class="table-tabs">${tables.map(t=>`<button class="table-tab ${t.id===active?.id?'active':''}" onclick="activeTables['${current}']='${t.id}';render()"><span>${t.icon}</span><span>${esc(t.name)}<small>${t.items.length} itens</small></span></button>`).join('')}</div></aside><div class="panel content"><div class="toolbar"><div class="filters"><input class="input" placeholder="Buscar..." value="${esc(query)}" oninput="query=this.value;render()"><select class="select" onchange="statusFilter=this.value;render()"><option value="">Todos os status</option>${['Ativo','Reserva','Manutenção','Defeito','Inativo','Pendente','Em trânsito','Entregue','Recebido'].map(s=>`<option ${statusFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn primary" onclick="openItemForm()">+ Adicionar item</button></div>${active?`<div class="sub" style="margin:0 0 12px">${active.icon} ${esc(active.name)} • ${items.length} resultados</div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${items.length?items.map(i=>`<tr class="data-row" onclick="showItem(${i.id})">${cols.map(c=>`<td>${c.key==='status'?`<span class="badge ${String(i[c.key]||'').toLowerCase().replaceAll(' ','-')}">${esc(i[c.key]||'—')}</span>`:esc(i[c.key]||'—')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">Nenhum item encontrado</td></tr>`}</tbody></table></div>`:`<div class="empty">Crie uma tabela para começar.</div>`}</div></div>`}
function columns(){let map={inventory:[['equipment','EQUIPAMENTO'],['serial','SÉRIE'],['brand','MARCA'],['model','MODELO'],['status','STATUS'],['date','ATUALIZADO']],control:[['equipment','EQUIPAMENTO'],['brand','MARCA'],['tag','TAG'],['model','MODELO'],['sector','SETOR'],['status','STATUS'],['entry','ENTRADA']],flux:[['movement','MOVIMENTAÇÃO'],['equipment','EQUIPAMENTO'],['model','MODELO'],['tag','TAG'],['company','EMPRESA'],['responsible','RESPONSÁVEL'],['date','DATA'],['status','STATUS']],nfe:[['number','NÚMERO DA NF-e'],['fiscal','FISCAL'],['cash','CAIXA'],['operator','OPERADOR'],['date','DATA/HORA'],['reason','MOTIVO']]};return map[current].map(([key,label])=>({key,label}))}
function management(){let dev=[{name:'PDV 01',tag:'PDV-001',type:'Frente de Loja',status:'Ativo'},{name:'PC Financeiro',tag:'TI-048',type:'Escritório',status:'Reserva'},{name:'Terminal Estoque',tag:'EST-013',type:'Estoque',status:'Manutenção'}];return `<div class="panel monitor"><div class="toolbar"><div class="filters"><input class="input" placeholder="Nome, TAG, IP, usuário..." oninput="query=this.value;render()"><select class="select"><option>Todos os status</option><option>Ativo</option><option>Reserva</option><option>Manutenção</option></select></div><span class="sub">● <span style="color:#45d483">Sistema online</span></span></div><div class="monitor-grid">${dev.filter(x=>JSON.stringify(x).toLowerCase().includes(query.toLowerCase())).map((d,i)=>`<div class="device" onclick="deviceDetails(${i})"><i class="led" style="background:${d.status==='Ativo'?'#45d483':d.status==='Reserva'?'#f2c75c':'#ff6b6b'}"></i><div class="screen"></div><b>${d.name}</b><small>${d.type}<br>${d.tag} • ${d.status}</small></div>`).join('')}</div></div>`}
function modal(content){$('#dialog').innerHTML=content;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openTableForm(){modal(`<div class="dialog-header"><h2>Nova tabela</h2><button class="btn icon" onclick="closeModal()">×</button></div><div class="field-grid"><label class="field">Nome da tabela<input id="tableName" class="input" placeholder="Ex.: Estoque Loja Centro"></label><label class="field">Ícone<input id="tableIcon" class="input" value="📁" maxlength="4"></label></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="createTable()">Criar tabela</button></div>`)}
function createTable(){let name=$('#tableName').value.trim();if(!name)return toast('Informe o nome da tabela');let t={id:Date.now().toString(),name,icon:$('#tableIcon').value||'📁',items:[]};db[current].tables.unshift(t);activeTables[current]=t.id;save();closeModal();render();toast('Tabela criada')}
function fields(){let m={inventory:[['equipment','Equipamento'],['serial','Nº de série'],['brand','Marca'],['model','Modelo'],['status','Status'],['situation','Situação']],control:[['equipment','Equipamento'],['brand','Marca'],['tag','TAG'],['model','Modelo'],['sector','Setor'],['status','Status'],['entry','Data de entrada'],['exit','Data de saída']],flux:[['movement','Movimentação'],['equipment','Equipamento'],['model','Modelo'],['tag','TAG'],['company','Empresa destino'],['responsible','Responsável remetente'],['date','Data do envio'],['status','Status'],['reason','Motivo']],nfe:[['number','Número da NF-e'],['fiscal','Fiscal'],['cash','Caixa'],['operator','Operador'],['date','Data/hora'],['reason','Motivo'],['notes','Observação']]};return m[current]}
function openItemForm(item){let fs=fields();modal(`<div class="dialog-header"><h2>${item?'Editar':'Adicionar'} item</h2><button class="btn icon" onclick="closeModal()">×</button></div><div class="field-grid">${fs.map(([k,l])=>`<label class="field">${l}${k==='status'?`<select class="select" data-k="${k}">${['Ativo','Reserva','Manutenção','Defeito','Inativo','Pendente','Em trânsito','Entregue','Recebido'].map(x=>`<option ${item?.[k]===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input class="input" data-k="${k}" value="${esc(item?.[k]||'')}" ${k.includes('date')||k==='entry'||k==='exit'?'type="date"':''}></label>`}`).join('')}</div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveItem(${item?.id||0})">Salvar</button></div>`)}
function active(){return db[current].tables.find(t=>t.id===activeTables[current])}function saveItem(id){let obj={id:id||Date.now()};document.querySelectorAll('[data-k]').forEach(e=>obj[e.dataset.k]=e.value);let t=active();if(id){t.items=t.items.filter(i=>i.id!==id)}t.items.unshift(obj);save();closeModal();render();toast(id?'Item atualizado e movido ao topo':'Item adicionado ao topo')}
function showItem(id){let i=active().items.find(x=>x.id===id);modal(`<div class="dialog-header"><h2>${esc(i.equipment||i.number||'Registro')}</h2><button class="btn icon" onclick="closeModal()">×</button></div><div class="details">${Object.entries(i).filter(([k])=>k!=='id').map(([k,v])=>`<div class="detail">${k}<b>${esc(v||'—')}</b></div>`).join('')}</div><h3 style="margin:22px 0 8px;font-size:14px">Logs</h3><div class="log"><b>Agora</b> • Registro visualizado</div><div class="log"><b>Criação/edição</b> • Dados atualizados na tabela ativa</div><div class="modal-footer"><button class="btn danger" onclick="deleteItem(${id})">Excluir</button><button class="btn primary" onclick="openItemForm(active().items.find(x=>x.id===${id}))">Editar</button></div>`)}function deleteItem(id){active().items=active().items.filter(i=>i.id!==id);save();closeModal();render();toast('Registro excluído')}
function deviceDetails(i){let x=[{name:'PDV 01',tag:'PDV-001',type:'Frente de Loja',status:'Ativo'},{name:'PC Financeiro',tag:'TI-048',type:'Escritório',status:'Reserva'},{name:'Terminal Estoque',tag:'EST-013',type:'Estoque',status:'Manutenção'}][i];modal(`<div class="dialog-header"><h2>${x.name}</h2><button class="btn icon" onclick="closeModal()">×</button></div><div class="details"><div class="detail">TAG<b>${x.tag}</b></div><div class="detail">Categoria<b>${x.type}</b></div><div class="detail">Status<b>${x.status}</b></div><div class="detail">Monitoramento<b>Online • Ping 12ms</b></div><div class="detail">CPU<b>32%</b></div><div class="detail">RAM<b>58%</b></div></div><h3 style="font-size:14px">Logs recentes</h3><div class="log"><b>10:15</b> Status verificado</div><div class="log"><b>09:42</b> Sistema sincronizado</div><div class="modal-footer"><button class="btn primary" onclick="closeModal()">Fechar</button></div>`)}function openDeviceForm(){toast('Cadastro de equipamentos será integrado ao Bin configurado.')}
function exportCsv(){let t=active();if(!t)return;let cols=columns().map(x=>x.key),out=[cols.join(';'),...t.items.map(i=>cols.map(k=>`"${String(i[k]||'').replaceAll('"','""')}"`).join(';'))].join('\n');download(out,`${db[current].name}.csv`,'text/csv')}function download(c,n,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type}));a.download=n;a.click();URL.revokeObjectURL(a.href)}function backup(){download(JSON.stringify(db,null,2),'aldeckot-backup.json','application/json');toast('Backup criado')}function restoreClick(){$('#restoreInput').click()}$('#restoreInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();toast('Backup restaurado')}catch{toast('Arquivo inválido')}};r.readAsText(f)}setInterval(()=>{let c=new Date();$('#clock')&&( $('#clock').textContent=c.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))},1000);render();
</script></body></html>
